name: Source checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Check lockfiles and release versions
        run: |
          uv lock --check
          uv run --frozen --only-group release python scripts/check_release.py
          git diff --check
          uv run --frozen --only-group release python apps/e2e/pyodide/lock.py --check

        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/pymalloy-release-env
      - name: Build documentation
        run: pnpm docs:build
        env:
          BASE_PATH: /pymalloy/
      - name: Check JavaScript, generated records, and unused code
        run: pnpm check

      - name: Lint Python
        run: uv run --frozen ruff check packages/python examples apps/e2e scripts

      - name: Check Python formatting
        run: uv run --frozen ruff format --check packages/python examples apps/e2e scripts

      - name: Check Rust source and ownership
        run: |
          pnpm --filter @pymalloy/python check:rust
          pnpm --filter @pymalloy/python test:rust
      - name: Type-check Python with ty
        run: uv run --frozen ty check

      - name: Type-check Python with Pyrefly
        run: uv run --frozen pyrefly check

      - name: Type-check Python with basedpyright
        run: uv run --frozen basedpyright

      - name: Lint workflows
        run: uvx --from actionlint-py==1.7.12.24 actionlint

  javascript:
    name: JavaScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Run package tests
        run: pnpm test

  python:
    name: Python tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python }}

      - name: Run Python tests
        run: uv run --frozen pytest -q

      - name: Run installed-package tests
        run: uv run --frozen pytest -m e2e -q

  floors:
    name: Python lower bounds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Run Python tests against declared minimum versions
        run: scripts/test-python-floors.sh

  browser:
    name: Browser and packed packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Install Chromium
        run: pnpm --filter @pymalloy/e2e exec playwright install --with-deps chromium

      - name: Test packed TypeScript packages
        run: pnpm canary

      - name: Test notebooks and browser sessions
        run: pnpm e2e --project marimo --project marimo-export --project jupyterlab --project browser

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  rust-dependencies:
    name: Rust dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Set up Rust policy tools
        uses: ./.github/actions/setup-rust
        with:
          audit: "true"
      - name: Audit Rust dependencies
        run: uv run --no-project --python 3.12 python packages/python/rust_tools.py audit
