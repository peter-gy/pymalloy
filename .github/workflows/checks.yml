name: Source checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Check lockfiles and release versions
        run: |
          pixi run --locked check-locks
          git diff --check
      - name: Build documentation
        run: pixi run --locked -e js docs
        env:
          BASE_PATH: /pymalloy/
      - name: Check JavaScript, generated records, and unused code
        run: pixi run --locked check-js
      - name: Check Python source and types
        run: pixi run --locked check-python
      - name: Check Rust source and ownership
        run: |
          pixi run --locked check-rust
          pixi run --locked test-rust
      - name: Lint workflows
        run: pixi run --locked lint-workflows
  javascript:
    name: JavaScript tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Run package tests
        run: pixi run --locked test-js

  python:
    name: Python tests (${{ matrix.runner }}, ${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - macos-15
          - windows-2022
        python:
          - "3.12"
          - "3.14"
        include:
          - python: "3.12"
            environment: default
          - python: "3.14"
            environment: py314
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup
        with:
          environment: ${{ matrix.environment }}
      - name: Run Python tests
        run: pixi run --locked -e "${{ matrix.environment }}" test-python

      - name: Run installed-package tests
        run: pixi run --locked -e "${{ matrix.environment }}" test-installed

  floors:
    name: Python lower bounds
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Run Python tests against declared minimum versions
        run: pixi run --locked floors

  browser:
    name: Browser and packed packages
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Install Chromium
        run: pixi run --locked install-browser

      - name: Test packed TypeScript packages
        run: pixi run --locked canary

      - name: Test notebooks and browser sessions
        run: pixi run --locked browser --project marimo --project marimo-export --project jupyterlab --project browser

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  rust-dependencies:
    name: Rust dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up dependency policy tools
        uses: ./.github/actions/setup
        with:
          build: "false"
      - name: Audit Rust dependencies
        run: pixi run --locked audit-rust
