name: Publish package
"on":
  push:
    tags:
      - v[0-9]*.[0-9]*.[0-9]*
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          node: "false"
      - name: Check annotated tag and package version
        run: |
          test "$(git cat-file -t "$GITHUB_REF")" = tag
          test "$GITHUB_REF_NAME" = "v$(uv version --package pymalloy --short)"
  validate:
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pages: write
      id-token: write
  publish:
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: pypi
      url: https://pypi.org/project/pymalloy/
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.12.12
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-dist
          path: dist/
      - name: Publish tested distributions
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple dist/*
