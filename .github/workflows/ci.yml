name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Source checks
    uses: ./.github/workflows/checks.yml
  wheels:
    name: Distribution targets
    uses: ./.github/workflows/wheels.yml
  check:
    name: Check
    if: always()
    needs:
      - checks
      - wheels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          failed = {name: job["result"] for name, job in json.loads(os.environ["NEEDS_JSON"]).items() if job["result"] != "success"}
          if failed:
              raise SystemExit(f"Required jobs did not succeed: {failed}")
          PY
