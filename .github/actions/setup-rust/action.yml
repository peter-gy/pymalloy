name: Set up Rust
description: Install the package toolchain and pinned Rust tools with a scoped build cache.
inputs:
  audit:
    description: Install dependency policy tools.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install package toolchain
      shell: bash
      run: uv run --no-project --python 3.12 python packages/python/rust_tools.py toolchain --github-env "$GITHUB_ENV"
    - name: Cache Rust dependencies and tools
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        workspaces: packages/python -> target
        shared-key: pymalloy-${{ inputs.audit }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
        cache-directories: ~/.cargo/pymalloy-v8
        key: ${{ hashFiles('packages/python/native-archives.json') }}
    - name: Install pinned Rust tools
      shell: bash
      env:
        INSTALL_AUDIT_TOOLS: ${{ inputs.audit }}
      run: |
        arguments=()
        if [[ "$INSTALL_AUDIT_TOOLS" == "true" ]]; then
          arguments+=(--audit)
        fi
        uv run --no-project --python 3.12 python packages/python/rust_tools.py tools "${arguments[@]}"
