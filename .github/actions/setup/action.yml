name: Set up PyMalloy tools
description: Install the workspace Node, VitePlus, uv, and Python versions.
inputs:
  node:
    description: Install Node and JavaScript dependencies
    default: "true"
  python:
    description: Install uv and Python
    default: "true"
  python-version:
    description: Override .python-version for compatibility testing
    default: ""
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      if: inputs.python == 'true'
      with:
        version-file: pyproject.toml
        python-version: ${{ inputs.python-version }}
        enable-cache: "true"
        cache-dependency-glob: uv.lock
    - name: Install Python
      run: |
        if [ -n "$PYTHON_VERSION" ]; then
          uv python install "$PYTHON_VERSION"
        else
          uv python install
        fi
      if: inputs.python == 'true'
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
    - uses: voidzero-dev/setup-vp@13e7afb99c66525824db54e107d667216e795d37
      if: inputs.node == 'true'
      with:
        version-file: pnpm-workspace.yaml
        node-version-file: .node-version
        cache: "true"
        sfw: "true"
        run-install: |
          - args: ['--frozen-lockfile', '--ignore-scripts']
