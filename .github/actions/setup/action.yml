name: Set up workspace
description: Install the locked Pixi environment and prepare workspace dependencies.
inputs:
  environment:
    description: Pixi environment to install.
    required: false
    default: default
  build:
    description: Build assets and install the Python workspace.
    required: false
    default: "true"
outputs:
  rust-cache-key:
    description: Rust dependency cache key.
    value: ${{ steps.rust-cache.outputs.cache-primary-key }}
  rust-cache-hit:
    description: Whether the Rust dependency cache matched.
    value: ${{ steps.rust-cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Install the locked Pixi environment
      uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
      with:
        pixi-version: 0.81.0
        environments: ${{ inputs.environment }}
        locked: "true"
        activate-environment: "false"
        cache-write: ${{ github.ref == 'refs/heads/main' }}
    - name: Restore Rust dependencies
      id: rust-cache
      if: inputs.environment != 'js'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/pymalloy-v8
        key: rust-${{ runner.os }}-${{ runner.arch }}-${{ inputs.environment }}-${{ hashFiles('pixi.lock', 'packages/python/Cargo.lock', 'packages/python/native-archives.json') }}
    - name: Install JavaScript dependencies
      if: inputs.build == 'false'
      shell: bash
      env:
        PIXI_ENVIRONMENT: ${{ inputs.environment }}
      run: pixi run --locked -e "$PIXI_ENVIRONMENT" setup-js
    - name: Build and install the workspace
      if: inputs.build == 'true'
      shell: bash
      env:
        PIXI_ENVIRONMENT: ${{ inputs.environment }}
      run: pixi run --locked -e "$PIXI_ENVIRONMENT" setup
    - name: Save Rust dependencies
      if: github.ref == 'refs/heads/main' && inputs.build == 'true' && inputs.environment != 'js' && steps.rust-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/pymalloy-v8
        key: ${{ steps.rust-cache.outputs.cache-primary-key }}
