[project]
name = "pymalloy"
version = "0.1.0"
description = "Run Malloy in browser widgets and server-side Python sessions"
readme = "README.md"
authors = [{ name = "Péter Ferenc Gyarmati", email = "dev.petergy@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["agent-plugins>=0.2", "anywidget>=0.11", "msgspec>=0.19", "traitlets>=5"]

[project.urls]
Homepage = "https://github.com/peter-gy/pymalloy"
Documentation = "https://peter-gy.github.io/pymalloy/"
Source = "https://github.com/peter-gy/pymalloy"
Issues = "https://github.com/peter-gy/pymalloy/issues"

[project.optional-dependencies]
server = ["deno>=2.9.6,<3", "duckdb>=1.5", "pytz>=2026.3"]
dataframes = ["polars>=1.44", "pyarrow>=25.0"]
marimo = ["marimo>=0.24"]
jupyter = ["nbformat>=5.11", "nbclient>=0.11", "ipykernel>=7.3"]

[project.scripts]
pymalloy = "pymalloy.cli:main"

[project.entry-points."marimo.agent.capability"]
pymalloy = "pymalloy.agent"

[build-system]
requires = ["agent-plugins>=0.2", "hatchling>=1.31.0"]
build-backend = "agent_plugins.build.hatchling"

[tool.agent-plugins]
root = "../.."

[tool.hatch.build]
artifacts = ["src/pymalloy/_assets/**"]

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/pymalloy"]

[tool.hatch.build.targets.sdist]
include = ["src", "pyproject.toml", "README.md", "hatch_build.py"]
