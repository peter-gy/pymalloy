[project]
name = "pymalloy"
version = "0.1.0"
description = "Run Malloy in browser widgets and native DuckDB sessions"
readme = "README.md"
authors = [{ name = "Péter Ferenc Gyarmati", email = "dev.petergy@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["anywidget>=0.11.0", "traitlets>=5.16.1"]

[project.urls]
Homepage = "https://github.com/peter-gy/pymalloy"
Documentation = "https://peter-gy.github.io/pymalloy/"
Source = "https://github.com/peter-gy/pymalloy"
Issues = "https://github.com/peter-gy/pymalloy/issues"

[project.optional-dependencies]
server = ["deno>=2.9.6", "duckdb>=1.5.5", "polars>=1.44.2", "pyarrow>=25.0.1", "sqlglot>=30.18.0"]
marimo = ["marimo>=0.24.0"]
jupyter = ["nbformat>=5.11.1", "nbclient>=0.11.0", "ipykernel>=7.3.0"]

[project.scripts]
pymalloy = "pymalloy.cli:main"

[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["src/pymalloy/_assets/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/pymalloy"]

[tool.hatch.build.targets.sdist]
include = ["src", "pyproject.toml", "README.md"]
