[project]
name = "pymalloy"
version = "0.1.0"
description = "Author, check, run, and share Malloy models from Python"
readme = "README.md"
authors = [{ name = "Péter Ferenc Gyarmati", email = "dev.petergy@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
  "agent-plugins>=0.2",
  "anywidget>=0.11",
  "anywidget-bundle>=0.1.1",
  "msgspec>=0.18.5",
  "traitlets>=5.13",
  "duckdb>=1.5; sys_platform != 'emscripten'",
  "pyarrow>=21.0; sys_platform != 'emscripten'",
  "tzdata>=2020.1; sys_platform != 'emscripten'",
]

[project.urls]
Homepage = "https://github.com/peter-gy/pymalloy"
Documentation = "https://peter-gy.github.io/pymalloy/"
Source = "https://github.com/peter-gy/pymalloy"
Issues = "https://github.com/peter-gy/pymalloy/issues"

[project.scripts]
pymalloy = "pymalloy.cli:main"

[project.entry-points."marimo.agent.capability"]
pymalloy = "pymalloy.agent"

[build-system]
requires = ["maturin>=1.11.5,<2"]
build-backend = "build_backend"
backend-path = ["."]

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "src"
module-name = "pymalloy._native"
locked = true
include = [
  { path = "Cargo.lock", format = "sdist" },
  { path = "build.rs", format = "sdist" },
  { path = "rust/**", format = "sdist" },
  { path = "native-archives.json", format = "sdist" },
  { path = "build_backend.py", format = "sdist" },
  { path = "native_archive.py", format = "sdist" },
  { path = "hatch_build.py", format = "sdist" },
  { path = "src/pymalloy/_assets/**", format = [
    "sdist",
    "wheel",
  ] },
]
exclude = [
  "node_modules/**",
  "target/**",
  "src/pymalloy/__pycache__/**",
  "src/pymalloy/**/*.pyc",
  "src/pymalloy/_native*.so",
  "src/pymalloy/_native*.pyd",
]

[tool.hatch.build]
artifacts = [
  "src/pymalloy/_assets/widget/**",
  "src/pymalloy/_assets/agent/**",
  "src/pymalloy/_assets/pyodide/**",
]

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/pymalloy"]
exclude = [
  "src/pymalloy/_native*.so",
  "src/pymalloy/_native*.pyd",
  "src/pymalloy/_native*.dll",
  "src/pymalloy/_assets/compiler*",
  "src/pymalloy/_assets/native*",
]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "README.md" },
  { file = "Cargo.toml" },
  { file = "Cargo.lock" },
  { file = "build.rs" },
  { file = "build_backend.py" },
  { file = "native_archive.py" },
  { file = "native-archives.json" },
  { file = "rust/**/*.rs" },
  { file = "src/pymalloy/**/*.py" },
  { file = "src/pymalloy/**/*.pyi" },
  { file = "src/pymalloy/py.typed" },
  { file = "src/pymalloy/_assets/**/*" },
]
