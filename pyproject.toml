[tool.uv]
required-version = ">=0.12"

[tool.uv.workspace]
members = ["packages/python"]

[tool.uv.sources]
pymalloy = { workspace = true }

[dependency-groups]
dev = [
  "pymalloy",
  "polars>=2",
  "marimo[recommended]>=0.25.1",
  "nbformat>=5.11",
  "nbclient>=0.11",
  "ipykernel>=7.4",
  "pytest>=9.1.1",
  "pytest-timeout>=2.4.0",
  "ruff>=0.17",
  "ty>=0.0.87",
  "jupyterlab>=4.6.4",
  "datamodel-code-generator>=0.83.0",
  "pyrefly>=1.3.2",
  "basedpyright>=1.40.2",
]

release = ["hatchling>=1.31.0", "maturin>=1.11.5,<2", "packaging>=26", "twine>=7.0.0"]

notebook-hosts = [
  "jupyterlite-core[contents,translation]==0.8.6",
  "jupyterlite-pyodide-kernel==0.8.6",
  "anywidget==0.11.0",
  "marimo==0.25.1",
  "nbformat>=5.11",
]

[tool.pytest.ini_options]
testpaths = ["packages/python/tests"]
markers = [
  "e2e: installed packages, exported notebooks, and CLI process boundaries (uv run pytest -m e2e)",
]
timeout = 180
timeout_method = "thread"

[tool.ruff]
target-version = "py312"
src = ["packages/python/src"]

[tool.ty.src]
include = ["packages/python/src"]

[tool.pyrefly]
min-severity = "warn"
project-includes = ["packages/python/src"]
search-path = ["packages/python/src"]
python-version = "3.12"

[tool.basedpyright]
include = ["packages/python/src"]
extraPaths = ["packages/python/src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
