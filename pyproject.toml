[tool.uv]
required-version = ">=0.12"

[tool.uv.workspace]
members = ["packages/python"]

[tool.uv.sources]
pymalloy = { workspace = true }

[dependency-groups]
dev = [
  "pymalloy[headless]",
  "polars>=1.44",
  "marimo[recommended]>=0.24",
  "nbformat>=5.11",
  "nbclient>=0.11",
  "ipykernel>=7.3",
  "pytest>=9.1.1",
  "ruff>=0.16.6",
  "ty>=0.0.80",
  "jupyterlab>=4.6.2",
  "datamodel-code-generator>=0.82.0",
  "pyrefly>=1.3.1",
  "basedpyright>=1.40.1",
]

release = ["twine>=7.0.0"]

[tool.pytest.ini_options]
testpaths = ["packages/python/tests"]

[tool.ruff]
target-version = "py312"
src = ["packages/python/src"]

[tool.ty.src]
include = ["packages/python/src"]

[tool.pyrefly]
min-severity = "warn"
project-includes = ["packages/python/src"]
search-path = ["packages/python/src"]
python-version = "3.12"

[tool.basedpyright]
include = ["packages/python/src"]
extraPaths = ["packages/python/src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
