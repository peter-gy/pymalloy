[tool.uv]
required-version = ">=0.12"

[tool.uv.workspace]
members = ["packages/python"]

[tool.uv.sources]
pymalloy = { workspace = true }

[dependency-groups]
dev = [
  "pymalloy[server,marimo,jupyter]",
  "pytest>=9.1.1",
  "ruff>=0.16.6",
  "ty>=0.0.80",
  "jupyterlab>=4.6.2",
]

release = ["twine>=7.0.0"]

[tool.pytest.ini_options]
testpaths = ["packages/python/tests"]

[tool.ruff]
target-version = "py312"
src = ["packages/python/src"]

[tool.ty.src]
include = ["packages/python/src"]
